<style>
:root{
  --paper:#E9E6DF;
  --paper-2:#E1DDD4;
  --ink:#161412;
  --ink-soft:#6B6862;
  --line:#CFC9BD;
  --tile:#DAD5C9;
  --tile-ink:#15130F;
  --pop:#D70000;
  --display:'Archivo',sans-serif;
  --mono:'Space Mono',monospace;
  --pad:1.15rem;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--display);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.noscroll{overflow:hidden}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
::selection{background:var(--ink);color:var(--paper)}

/* fly-down flower */
.flydown{position:fixed;z-index:150;display:none;pointer-events:none;will-change:transform,opacity}

/* corner mark */
.mark{position:fixed;top:calc(.85rem + env(safe-area-inset-top));left:calc(var(--pad) + env(safe-area-inset-left));z-index:90;display:flex;align-items:center;gap:.45rem;
  font-weight:900;font-size:1rem;letter-spacing:-.02em;opacity:0;transform:translateY(-8px);
  transition:opacity .45s ease,transform .45s ease;pointer-events:none;
  padding:.3rem .55rem .3rem .35rem;background:rgba(233,230,223,.7);backdrop-filter:blur(8px);border-radius:40px}
.mark.show{opacity:1;transform:translateY(0);pointer-events:auto}
.mark img{height:20px;width:auto}

/* ===== CART ICON (top right) ===== */
.cart-btn{position:fixed;top:calc(.85rem + env(safe-area-inset-top));right:calc(var(--pad) + env(safe-area-inset-right));z-index:90;display:flex;align-items:center;justify-content:center;
  width:44px;height:44px;border:none;background:transparent;cursor:pointer;color:var(--ink);
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.cart-btn.show{opacity:1;transform:translateY(0);pointer-events:auto}
.cart-btn svg{width:21px;height:21px;display:block}
.cart-btn .badge{position:absolute;top:1px;right:0px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--pop);color:var(--paper);font-family:var(--mono);font-size:.62rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1;transform:scale(1);transition:transform .25s var(--ease)}
.cart-btn .badge.bump{transform:scale(1.35)}

/* ===== CART DRAWER ===== */
.cart-backdrop{position:fixed;inset:0;background:rgba(15,13,11,.42);z-index:120;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.cart-backdrop.open{opacity:1;pointer-events:auto}
.cart-drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--paper);z-index:121;
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s var(--ease);
  box-shadow:-18px 0 40px rgba(15,13,11,.18)}
.cart-drawer.open{transform:translateX(0)}
.cart-head{display:flex;align-items:center;justify-content:space-between;padding:calc(1.2rem + env(safe-area-inset-top)) calc(var(--pad) + env(safe-area-inset-right)) .9rem var(--pad);border-bottom:1px solid var(--line)}
.cart-head h2{font-size:1.02rem;font-weight:800;letter-spacing:.01em}
.cart-head .count{font-family:var(--mono);font-size:.68rem;color:var(--ink-soft);margin-left:.5rem}
.cart-close{background:none;border:none;cursor:pointer;font-size:1.4rem;line-height:1;color:var(--ink);min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}

.cart-body{flex:1;overflow-y:auto;padding:.4rem var(--pad)}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;height:100%;text-align:center;color:var(--ink-soft)}
.cart-empty p{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.cart-empty button{background:var(--ink);color:var(--paper);border:none;font-family:var(--mono);font-size:.7rem;
  letter-spacing:.15em;text-transform:uppercase;padding:.8rem 1.5rem;cursor:pointer}

.cart-line{display:flex;gap:.8rem;padding:.95rem 0;border-bottom:1px solid var(--line)}
.cart-line .thumb{width:60px;height:60px;flex-shrink:0;background:var(--paper-2);border-radius:2px;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.cart-line .thumb img{width:60%;height:60%;object-fit:contain;opacity:.8}
.cart-line .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:.25rem}
.cart-line .name{font-size:.86rem;font-weight:700;line-height:1.2}
.cart-line .price{font-family:var(--mono);font-size:.74rem;color:var(--ink-soft)}
.cart-line .row{display:flex;align-items:center;justify-content:space-between;margin-top:.15rem}
.qty-stepper{display:flex;align-items:center;border:1px solid var(--line);height:38px}
.qty-stepper button{width:38px;height:100%;border:none;background:none;cursor:pointer;font-size:1.05rem;color:var(--ink);display:flex;align-items:center;justify-content:center}
.qty-stepper button:active{background:var(--paper-2)}
.qty-stepper span{min-width:30px;text-align:center;font-family:var(--mono);font-size:.78rem}
.cart-remove{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);
  background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:.5rem 0;margin:-.5rem 0;display:inline-block}
.cart-remove:hover{color:var(--pop)}
.cart-line .linetotal{font-family:var(--mono);font-size:.78rem;font-weight:700}

.cart-foot{border-top:1px solid var(--line);padding:1rem var(--pad) calc(1.1rem + env(safe-area-inset-bottom));background:var(--paper)}
.ship-note{font-family:var(--mono);font-size:.66rem;color:var(--ink-soft);text-align:center;margin-bottom:.7rem;letter-spacing:.02em}
.cart-subtotal{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.85rem}
.cart-subtotal .label{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.cart-subtotal .amt{font-size:1.15rem;font-weight:800}
.checkout-btn{width:100%;background:var(--ink);color:var(--paper);border:none;font-family:var(--mono);font-weight:700;
  font-size:.82rem;letter-spacing:.15em;text-transform:uppercase;padding:1rem;cursor:pointer;transition:transform .15s ease}
.checkout-btn:active{transform:scale(.98)}
.cart-trust{display:flex;align-items:center;justify-content:center;gap:.4rem;margin-top:.7rem;
  font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase}
.cart-trust svg{width:11px;height:11px;flex-shrink:0}

@media (max-width:480px){
  .cart-drawer{width:100vw}
}

/* SHORT / LANDSCAPE VIEWPORTS — compact the hero so it doesn't overflow
   or force scroll on landscape phones and short browser windows. */
@media (max-height:560px) and (orientation:landscape){
  .hero{padding:3.2rem 1.2rem 2.2rem;min-height:auto}
  .hero-logo{width:clamp(48px,10vw,72px);margin-bottom:.6rem;animation:pop .9s .05s var(--ease) forwards}
  .wordmark{font-size:clamp(1.8rem,7vw,3.5rem)}
  .hero-meta{margin-top:.6rem}
  .shop-btn{margin-top:1.1rem;padding:.8rem 1.8rem}
  .scrollcue{display:none}
}

/* HERO */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6rem 1.2rem 4.5rem;position:relative}
.hero-logo{width:clamp(72px,21vw,128px);margin-bottom:1.5rem;will-change:transform;opacity:0;animation:pop .9s .05s var(--ease) forwards,float 6s 1s ease-in-out infinite}
.hero-logo.hidden{visibility:hidden}
.wordmark{font-weight:900;font-size:clamp(2.2rem,13.5vw,10rem);line-height:.85;letter-spacing:-.055em;display:flex;flex-wrap:nowrap;max-width:100%}
.wordmark span{display:inline-block;opacity:0;transform:translateY(40px);animation:rise .7s var(--ease) forwards}
.hero-meta{font-family:var(--mono);font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);margin-top:1.4rem;opacity:0;animation:rise .8s .55s var(--ease) forwards}
.shop-btn{margin-top:2.4rem;display:inline-flex;align-items:center;gap:.7rem;background:var(--ink);color:var(--paper);font-family:var(--mono);font-weight:700;font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;padding:1.15rem 2.6rem;border:none;cursor:pointer;position:relative;overflow:hidden;opacity:0;animation:rise .8s .7s var(--ease) forwards;transition:transform .25s ease}
.shop-btn span.t,.shop-btn .arr{position:relative;z-index:1}
.shop-btn .arr{animation:nudge 1.8s ease-in-out infinite}
.shop-btn::after{content:'';position:absolute;inset:0;background:var(--pop);transform:translateY(101%);transition:transform .35s var(--ease)}
.shop-btn:active{transform:scale(.97)}
@media(hover:hover){.shop-btn:hover::after{transform:translateY(0)}}
.scrollcue{position:absolute;bottom:1.4rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.58rem;letter-spacing:.3em;color:var(--ink-soft);text-transform:uppercase;opacity:0;animation:fade 1s 1.1s forwards}
.scrollcue i{width:1px;height:26px;background:var(--ink-soft);animation:cue 1.8s ease-in-out infinite;transform-origin:top}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes fade{to{opacity:1}}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes cue{0%,100%{transform:scaleY(.4);opacity:.4}50%{transform:scaleY(1);opacity:1}}

/* DROP */
.drop{padding-top:3.5rem}
.drop-photo{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--paper-2)}
.drop-photo-inner{position:absolute;inset:-9% 0;background-size:cover;background-position:center bottom;will-change:transform;transform:scale(1.06);transition:opacity 1.1s var(--ease);opacity:.55}
.drop-photo.seen .drop-photo-inner{opacity:1}
.drop-photo-inner.ph{background:radial-gradient(120% 90% at 50% 12%,var(--paper) 0%,var(--paper-2) 55%,#D2CCBF 100%);display:flex;align-items:center;justify-content:center}
.drop-photo-inner.ph img{width:38%;max-width:190px;opacity:.16}
.drop-scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(18,16,14,.62) 0%,rgba(18,16,14,.12) 38%,transparent 62%)}
.drop-photo .top{position:absolute;top:var(--pad);left:var(--pad);right:var(--pad);z-index:2;display:flex;justify-content:flex-end}
.drop-tag{font-family:var(--mono);font-size:.64rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:.4rem .7rem;border:1.5px solid #fff;color:#fff}
.drop-tag.live{background:var(--pop);border-color:var(--pop);animation:tagPulse 2.6s ease-in-out infinite}
@keyframes tagPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(215,0,0,.28)}
  50%{transform:scale(1.025);box-shadow:0 0 0 3px rgba(215,0,0,0)}
}
.drop-photo .cap{position:absolute;left:var(--pad);right:var(--pad);bottom:1.1rem;z-index:2;overflow:hidden}
.drop-title{font-weight:800;font-size:clamp(2.4rem,11vw,5rem);line-height:.9;letter-spacing:-.04em;color:#fff;transform:translateY(112%);transition:transform .95s cubic-bezier(.19,1,.22,1)}
.drop-photo.seen .drop-title{transform:translateY(0)}
.drop-photo .ph-note{position:absolute;top:1rem;left:var(--pad);z-index:2;font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}

/* ITEMS */
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5rem .95rem;padding:1.7rem var(--pad) 0}
.item{display:block;cursor:pointer}
.item-tile{position:relative;aspect-ratio:4/5;background:var(--tile);overflow:hidden;display:flex;align-items:center;justify-content:center;transition:background .4s ease,box-shadow .4s ease}
.item-tile .ph{height:30%;max-height:74px;opacity:.16;transition:opacity .4s ease,transform .55s var(--ease)}
.item-num{position:absolute;top:.6rem;left:.7rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;color:var(--ink-soft);transition:color .4s ease}
.item-row{display:flex;justify-content:space-between;align-items:baseline;gap:.7rem;margin-top:.75rem}
.item-name{font-weight:700;font-size:.9rem;letter-spacing:-.01em;line-height:1.2;background:linear-gradient(currentColor,currentColor) 0 100%/0% 1px no-repeat;transition:background-size .45s var(--ease)}
.item-price{font-family:var(--mono);font-size:.78rem;white-space:nowrap}
.item:active .item-tile{background:var(--tile-ink)}
.item:active .item-tile .ph{opacity:.9;transform:scale(1.08)}
.item:active .item-num{color:var(--paper)}
@media(hover:hover){
  .item:hover .item-tile{background:var(--tile-ink);box-shadow:0 16px 34px rgba(20,18,15,.15)}
  .item:hover .item-tile .ph{opacity:.9;transform:scale(1.08)}
  .item:hover .item-num{color:var(--paper)}
  .item:hover .item-name{background-size:100% 1px}
}
.item.sold{cursor:not-allowed}
.item.sold .item-tile{background:var(--paper-2)}
.item.sold .item-name,.item.sold .item-tile .ph{opacity:.4}
.item.sold .item-name{background-size:0 1px!important}
.item.sold:active .item-tile,.item.sold:hover .item-tile{background:var(--paper-2);box-shadow:none}
.item.sold:active .item-tile .ph,.item.sold:hover .item-tile .ph{opacity:.4;transform:none}
.item.sold:active .item-num,.item.sold:hover .item-num{color:var(--ink-soft)}
.sold-flag{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;color:var(--pop)}

/* reveal */
.r{opacity:0;transform:translateY(26px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.r.in{opacity:1;transform:translateY(0)}

/* ===== PRODUCT MODAL ===== */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(18,16,14,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .35s ease}
.modal.open .modal-backdrop{opacity:1}
.modal-card{position:relative;z-index:2;width:100%;max-width:560px;max-height:92vh;max-height:92svh;background:var(--paper);
  border-radius:24px 24px 0 0;overflow:hidden;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .46s cubic-bezier(.18,.9,.2,1);box-shadow:0 -20px 60px rgba(0,0,0,.25)}
.modal.open .modal-card{transform:translateY(0)}
.modal-close{position:absolute;top:.6rem;right:.6rem;z-index:5;width:44px;height:44px;border:none;border-radius:50%;
  background:rgba(233,230,223,.88);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ink);
  font-size:1.4rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s ease,background .2s ease}
.modal-close:hover{transform:rotate(90deg)}
.modal-img{position:relative;width:100%;aspect-ratio:1/1;flex-shrink:0;background-size:cover;background-position:center}
.modal-img.ph{background:radial-gradient(120% 100% at 50% 18%,var(--paper) 0%,var(--paper-2) 52%,#D2CCBF 100%);display:flex;align-items:center;justify-content:center}
.modal-img.ph img{width:34%;max-width:150px;opacity:.18}
.modal-body{padding:1.5rem var(--pad) calc(1.7rem + env(safe-area-inset-bottom));overflow-y:auto;display:flex;flex-direction:column}
.modal-eyebrow{font-family:var(--mono);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.modal-name{font-weight:800;font-size:clamp(1.55rem,5.5vw,2.1rem);letter-spacing:-.025em;line-height:1.04;margin-top:.45rem}
.modal-price{font-family:var(--mono);font-size:1rem;margin-top:.6rem}
.modal-desc{font-size:.94rem;line-height:1.65;color:var(--ink-soft);margin-top:1rem}
.modal-soldout{margin-top:1.1rem;padding:1.1rem 1.2rem;border:1px solid var(--line);border-radius:13px;background:var(--paper-2)}
.modal-soldout .sold-flag{font-weight:700}
.modal-soldout-note{font-size:.88rem;line-height:1.55;color:var(--ink-soft);margin-top:.5rem}
.modal-actions{display:flex;gap:.7rem;margin-top:1.7rem}
.btn-buy,.btn-cart{flex:1;font-family:var(--mono);font-weight:700;font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;padding:1.05rem;border-radius:13px;cursor:pointer;transition:background .25s ease,color .25s ease,transform .15s ease}
.btn-buy{background:var(--ink);color:var(--paper);border:1.5px solid var(--ink)}
.btn-cart{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn-buy:active,.btn-cart:active{transform:scale(.98)}
.btn-cart:disabled{opacity:.65;cursor:default}
@media(hover:hover){
  .btn-buy:hover{background:var(--pop);border-color:var(--pop)}
  .btn-cart:hover{background:var(--ink);color:var(--paper)}
}

/* FOOTER */
.foot{padding:4.5rem var(--pad) calc(2.4rem + env(safe-area-inset-bottom));margin-top:3.5rem;border-top:1.5px solid var(--ink);display:flex;flex-direction:column;gap:1.6rem}
.foot-brand{display:flex;align-items:center;gap:.55rem;font-weight:900;font-size:1.5rem;letter-spacing:-.03em}
.foot-brand img{height:30px;width:auto}
.foot-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.foot-links{display:flex;gap:1.4rem;font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}
.foot-links a{color:var(--ink-soft);transition:color .2s ease}
.foot-links a:active,.foot-links a:hover{color:var(--ink)}
.foot-copy{font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase}

/* TABLET (bridges the gap between phones and desktop) */
@media(min-width:541px) and (max-width:759px){
  :root{--pad:1.6rem}
  .items{grid-template-columns:repeat(3,1fr);gap:1.6rem 1.1rem}
  .drop-photo{aspect-ratio:16/9;max-height:62vh}
}

/* DESKTOP */
@media(min-width:760px){
  :root{--pad:2.4rem}
  .items{grid-template-columns:repeat(4,1fr);gap:1.9rem 1.5rem;max-width:1320px;margin:0 auto;padding-top:2.2rem}
  .drop-photo{aspect-ratio:32/9;max-height:55vh}
  .drop-photo-inner.ph img{width:13%}
  .drop-title{font-size:clamp(3.5rem,7vw,6.5rem)}
  .foot{flex-direction:row;justify-content:space-between;align-items:flex-end;max-width:1320px;margin:3.5rem auto 0}
  .hero-logo{margin-bottom:1.9rem}
  .modal{align-items:center;padding:2rem}
  .modal-card{flex-direction:row;border-radius:24px;max-width:920px;max-height:86vh;transform:translateY(22px) scale(.97);opacity:0;transition:transform .42s var(--ease),opacity .35s ease;box-shadow:0 30px 80px rgba(0,0,0,.3)}
  .modal.open .modal-card{transform:none;opacity:1}
  .modal-img{width:50%;aspect-ratio:auto;align-self:stretch;min-height:420px}
  .modal-body{width:50%;justify-content:center;padding:2.8rem 2.4rem}
  .modal-desc{margin-top:1.1rem}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .hero-logo,.wordmark span,.hero-meta,.shop-btn,.scrollcue{opacity:1!important;transform:none!important}
  .r{opacity:1;transform:none}
  .drop-photo-inner{inset:0!important;transform:none!important;opacity:1!important}
  .drop-title{transform:none!important}
  .modal-card{transform:none!important;opacity:1!important}
}
</style>

/* Lookup map: id -> item (built once from DROPS). The cart only ever
   stores ids + quantities, and re-derives name/price/image from here,
   so adding/removing/reordering products in DROPS never breaks a cart
   someone already has saved. */
const ITEMS_BY_ID = {};
DROPS.forEach(d => d.items.forEach(it => { ITEMS_BY_ID[it.id] = it; }));
function priceToNumber(str){
  const n = parseFloat(String(str).replace(/[^0-9.]/g,''));
  return isNaN(n) ? 0 : n;
}

document.getElementById('wordmark').innerHTML =
  'earlspade'.split('').map((ch,i)=>`<span style="animation-delay:${.12+i*.045}s">${ch}</span>`).join('');

function photoHTML(d){
  const inner = d.photo
    ? `<div class="drop-photo-inner" style="background-image:url('${d.photo}')"></div>`
    : `<div class="drop-photo-inner ph"><img src="${LOGO}" alt=""></div>`;
  const top = d.tag ? `<div class="top"><span class="drop-tag${d.live?' live':''}">${d.tag}</span></div>` : '';
  const note = d.photo ? '' : `<span class="ph-note">Campaign image</span>`;
  return `<div class="drop-photo">${inner}<div class="drop-scrim"></div>${top}<div class="cap"><h2 class="drop-title">${d.title}</h2></div>${note}</div>`;
}

function renderDrops(){
  document.getElementById('shop').innerHTML = DROPS.map((d,di)=>{
    const id = di===0?' id="latest"':'';
    const items = d.items.map((it,i)=>{
      const num = String(i+1).padStart(2,'0');
      const tail = it.soldout ? `<span class="sold-flag">Sold Out</span>` : `<span class="item-price">${it.price}</span>`;
      const delay = (i%4)*0.07;
      // Sold-out items are still clickable: opening the box for a sold-out
      // product shows the sold-out state rather than buy/cart controls.
      const open = ` href="javascript:void(0)" onclick="try{openProduct(${di},${i});}catch(e){console.error(e);} return false;"`;
      return `<a class="item${it.soldout?' sold':''} r"${open} style="transition-delay:${delay}s">
          <div class="item-tile"><span class="item-num">${num}</span><img class="ph" src="${LOGO}" alt=""></div>
          <div class="item-row"><span class="item-name">${it.name}</span>${tail}</div>
        </a>`;
    }).join('');
    return `<section class="drop"${id}>${photoHTML(d)}<div class="items">${items}</div></section>`;
  }).join('');
  initReveal();
  initParallax();
}

/* ===== PRODUCT MODAL ===== */
function openProduct(di,i){
  const d = DROPS[di], it = d.items[i];
  const modal = document.getElementById('modal');
  const img = document.getElementById('mImg');
  if(it.img){ img.classList.remove('ph'); img.style.backgroundImage=`url('${it.img}')`; img.innerHTML=''; }
  else { img.classList.add('ph'); img.style.backgroundImage=''; img.innerHTML=`<img src="${LOGO}" alt="">`; }
  document.getElementById('mEyebrow').textContent = d.title;
  document.getElementById('mName').textContent = it.name;

  const price = document.getElementById('mPrice');
  const desc = document.getElementById('mDesc');
  const soldout = document.getElementById('mSoldout');
  const actions = document.getElementById('mActions');

  if(it.soldout){
    // Sold-out items just show the sold-out notice — no price, no
    // description, no buy/cart controls.
    price.style.display = 'none';
    desc.style.display = 'none';
    actions.style.display = 'none';
    soldout.style.display = 'block';
  } else {
    price.style.display = '';
    desc.style.display = '';
    actions.style.display = 'flex';
    soldout.style.display = 'none';
    price.textContent = it.price;
    desc.textContent = it.desc || '';
    const buy = document.getElementById('mBuy');
    buy.onclick = () => { if(it.href && it.href !== '#') window.open(it.href,'_blank','noopener'); };
    const cart = document.getElementById('mCart');
    cart.textContent='Add to Cart'; cart.disabled=false;
    cart.onclick = () => {
      addToCart(it.id, 1);
      cart.textContent='Added \u2713'; cart.disabled=true;
      setTimeout(()=>{cart.textContent='Add to Cart';cart.disabled=false;},1500);
    };
  }

  modal.classList.add('open'); modal.setAttribute('aria-hidden','false');
  document.body.classList.add('noscroll');
  document.getElementById('mClose').focus();
}
function closeModal(){
  const modal=document.getElementById('modal');
  modal.classList.remove('open'); modal.setAttribute('aria-hidden','true');
  document.body.classList.remove('noscroll');
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); closeCart(); } });

function scrollToLatest(){
  const el=document.getElementById('latest');
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}

/* Shop click: hero flower shoots down, page follows */
function onShop(){
  const logo=document.getElementById('heroLogo'), fly=document.getElementById('flydown');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const r=logo.getBoundingClientRect();
  if(reduce || r.bottom<0){ scrollToLatest(); return; }
  fly.style.left=r.left+'px'; fly.style.top=r.top+'px'; fly.style.width=r.width+'px'; fly.style.height=r.height+'px';
  fly.style.display='block'; logo.classList.add('hidden');
  const endY=window.innerHeight-r.top+r.height;
  const anim=fly.animate([
    {transform:'translateY(0) rotate(0deg) scale(1)',opacity:1,offset:0},
    {transform:'translateY(-14px) rotate(-30deg) scale(1.12)',opacity:1,offset:0.18},
    {transform:`translateY(${endY}px) rotate(380deg) scale(.55)`,opacity:0,offset:1}
  ],{duration:780,easing:'cubic-bezier(.45,0,.55,1)'});
  anim.onfinish=()=>{ fly.style.display='none'; logo.classList.remove('hidden'); };
  setTimeout(scrollToLatest,300);
}

function initReveal(){
  const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.12});
  document.querySelectorAll('.r').forEach(el=>io.observe(el));
  const io2=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('seen');io2.unobserve(e.target);}});},{threshold:.2});
  document.querySelectorAll('.drop-photo').forEach(el=>io2.observe(el));
}

let pxEls=[],ticking=false;
function initParallax(){ pxEls=[...document.querySelectorAll('.drop-photo')]; onScroll(); }
function onScroll(){
  if(!ticking){
    requestAnimationFrame(()=>{
      const vh=window.innerHeight;
      pxEls.forEach(p=>{
        const r=p.getBoundingClientRect();
        if(r.bottom<0||r.top>vh) return;
        const prog=(r.top+r.height/2-vh/2)/vh;
        const inner=p.querySelector('.drop-photo-inner');
        if(inner && p.classList.contains('seen')) inner.style.transform=`translateY(${prog*-9}%) scale(1.06)`;
      });
      ticking=false;
    });
    ticking=true;
  }
}
const mark=document.getElementById('mark');
window.addEventListener('scroll',()=>{onScroll();mark.classList.toggle('show',window.scrollY>window.innerHeight*0.72);},{passive:true});
window.addEventListener('resize',onScroll,{passive:true});

/* ===== CART ====================================================
   State shape: { "<item-id>": <quantity>, ... }
   Stored in localStorage so a cart survives a page refresh. Items
   are referenced only by their stable id (see ITEMS_BY_ID above),
   so the cart never breaks even if products are added, removed, or
   reordered in DROPS later.
================================================================== */
const CART_KEY = 'earlspade_cart_v1';
let CART = {};

function loadCart(){
  try{
    const raw = localStorage.getItem(CART_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    // Drop any ids that no longer exist (e.g. a discontinued product) or
    // that have since sold out (so a stale saved cart can't check out an
    // item that's no longer available).
    const clean = {};
    Object.keys(parsed).forEach(id => {
      const it = ITEMS_BY_ID[id];
      if(it && !it.soldout && parsed[id] > 0) clean[id] = parsed[id];
    });
    CART = clean;
  }catch(e){ CART = {}; }
}
function saveCart(){
  try{ localStorage.setItem(CART_KEY, JSON.stringify(CART)); }catch(e){ /* storage unavailable, cart stays in-memory for this session */ }
}
function cartCount(){
  return Object.values(CART).reduce((sum,q)=>sum+q, 0);
}
function cartSubtotal(){
  return Object.entries(CART).reduce((sum,[id,q])=>{
    const it = ITEMS_BY_ID[id];
    return it ? sum + priceToNumber(it.price)*q : sum;
  }, 0);
}

function addToCart(id, qty){
  const it = ITEMS_BY_ID[id];
  if(!it || it.soldout) return;
  CART[id] = (CART[id] || 0) + qty;
  saveCart();
  renderCartBadge(true);
  renderCartBody();
}
function setQty(id, qty){
  if(!ITEMS_BY_ID[id]) return;
  if(qty <= 0){ delete CART[id]; }
  else { CART[id] = qty; }
  saveCart();
  renderCartBadge(false);
  renderCartBody();
}
function removeFromCart(id){
  delete CART[id];
  saveCart();
  renderCartBadge(false);
  renderCartBody();
}

function renderCartBadge(bump){
  const btn = document.getElementById('cartBtn');
  const badge = document.getElementById('cartBadge');
  const count = cartCount();
  if(count > 0){
    btn.classList.add('show');
    badge.style.display='flex';
    badge.textContent = count > 99 ? '99+' : String(count);
    if(bump){ badge.classList.remove('bump'); requestAnimationFrame(()=>badge.classList.add('bump')); setTimeout(()=>badge.classList.remove('bump'),260); }
  } else {
    // Once shown, the icon stays visible (so it's easy to find an empty
    // cart again) but the numeric badge hides until something's in it.
    badge.style.display='none';
    if(localStorage.getItem('earlspade_cart_seen')) btn.classList.add('show');
  }
}

function lineHTML(id, qty){
  const it = ITEMS_BY_ID[id];
  const unit = priceToNumber(it.price);
  const lineTotal = unit*qty;
  const imgTag = it.img ? `<img src="${it.img}" alt="">` : `<img src="${LOGO}" alt="">`;
  return `<div class="cart-line" data-id="${id}">
      <div class="thumb">${imgTag}</div>
      <div class="info">
        <span class="name">${it.name}</span>
        <span class="price">${it.price} each</span>
        <div class="row">
          <div class="qty-stepper">
            <button aria-label="Decrease quantity" onclick="setQty('${id}', ${qty-1})">&minus;</button>
            <span>${qty}</span>
            <button aria-label="Increase quantity" onclick="setQty('${id}', ${qty+1})">+</button>
          </div>
          <span class="linetotal">$${lineTotal.toFixed(2).replace(/\.00$/,'')}</span>
        </div>
        <button class="cart-remove" onclick="removeFromCart('${id}')">Remove</button>
      </div>
    </div>`;
}

function renderCartBody(){
  const body = document.getElementById('cartBody');
  const foot = document.getElementById('cartFoot');
  const ids = Object.keys(CART);
  if(ids.length === 0){
    body.innerHTML = `<div class="cart-empty">
        <p>Your cart is empty</p>
        <button onclick="closeCart()">Continue Shopping</button>
      </div>`;
    foot.style.display = 'none';
    document.getElementById('cartCount').textContent = '';
    return;
  }
  body.innerHTML = ids.map(id => lineHTML(id, CART[id])).join('');
  foot.style.display = 'block';
  const count = cartCount();
  document.getElementById('cartCount').textContent = `(${count} ${count===1?'item':'items'})`;
  const subtotal = cartSubtotal();
  document.getElementById('cartSubtotal').textContent = `$${subtotal.toFixed(2).replace(/\.00$/,'')}`;
  const FREE_SHIP_THRESHOLD = 150;
  const remaining = FREE_SHIP_THRESHOLD - subtotal;
  document.getElementById('shipNote').textContent = remaining > 0
    ? `Add $${remaining.toFixed(2).replace(/\.00$/,'')} more for free shipping`
    : `You\u2019ve unlocked free shipping`;
}

function openCart(){
  localStorage.setItem('earlspade_cart_seen','1');
  document.getElementById('cartBackdrop').classList.add('open');
  document.getElementById('cartDrawer').classList.add('open');
  document.getElementById('cartDrawer').setAttribute('aria-hidden','false');
  document.body.classList.add('noscroll');
  renderCartBody();
}
function closeCart(){
  document.getElementById('cartBackdrop').classList.remove('open');
  document.getElementById('cartDrawer').classList.remove('open');
  document.getElementById('cartDrawer').setAttribute('aria-hidden','true');
  document.body.classList.remove('noscroll');
}

async function goToCheckout(){
  if(cartCount() === 0) return;
  const btn = document.getElementById('checkoutBtn');
  btn.disabled = true;
  btn.textContent = 'Redirecting…';
  try{
    const res = await fetch('/api/create-checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cart: CART }),
    });
    if(!res.ok){ throw new Error('Checkout request failed'); }
    const data = await res.json();
    if(data.url){
      window.location.href = data.url; // hand off to Stripe's hosted page
    } else {
      throw new Error('No checkout URL returned');
    }
  } catch(err){
    console.error(err);
    btn.disabled = false;
    btn.textContent = 'Checkout';
    alert('Something went wrong starting checkout. Please try again.');
  }
}

loadCart();
renderCartBadge(false);
renderDrops();
</script>
